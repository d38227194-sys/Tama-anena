<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة طمأنينة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <i class="fa-solid fa-heart-pulse text-2xl text-pink-300"></i>
                <h1 class="text-xl font-bold">منصة طمأنينة</h1>
            </div>
            <div class="flex bg-indigo-700 rounded-lg p-1 text-sm font-semibold">
                <button id="btn-student-view" onclick="switchView('student')" class="px-4 py-1.5 rounded-md bg-white text-indigo-700 shadow transition">واجهة الطالب</button>
                <button id="btn-counselor-view" onclick="switchView('counselor')" class="px-4 py-1.5 rounded-md text-indigo-100 hover:text-white transition">لوحة المرشد</button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8">

        <!-- ================= STUDENT VIEW ================= -->
        <section id="student-view" class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-2xl font-bold text-slate-800 mb-2">مرحباً بك! كيف تشعر اليوم؟ 👋</h2>
                <p class="text-slate-500 text-sm mb-6">شاركنا مشاعرك اليومية لمساعدتك في الحصول على بيئة دراسية أفضل.</p>

                <form id="feeling-form" onsubmit="submitResponse(event)" class="space-y-6">
                    <!-- Student Info -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-1 text-slate-700">الاسم (اختياري/أو اكتب اسمك):</label>
                            <input type="text" id="student-name" placeholder="مثال: أحمد" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1 text-slate-700">الصف الدراسي:</label>
                            <select id="student-grade" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none">
                                <option value="الثامن">الصف الثامن</option>
                                <option value="التاسع">الصف التاسع</option>
                                <option value="العاشر">الصف العاشر</option>
                            </select>
                        </div>
                    </div>

                    <!-- Emotion Selection -->
                    <div>
                        <label class="block text-sm font-semibold mb-3 text-slate-700">اختر شعورك الحالي:</label>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="emotions-container">
                            <button type="button" onclick="selectEmotion('سعيد 😃')" class="emotion-btn p-4 border-2 rounded-xl text-center hover:border-indigo-500 transition flex flex-col items-center gap-2">
                                <span class="text-3xl">😃</span>
                                <span class="font-semibold text-sm">سعيد</span>
                            </button>
                            <button type="button" onclick="selectEmotion('متوتر 😟')" class="emotion-btn p-4 border-2 rounded-xl text-center hover:border-indigo-500 transition flex flex-col items-center gap-2">
                                <span class="text-3xl">😟</span>
                                <span class="font-semibold text-sm">متوتر</span>
                            </button>
                            <button type="button" onclick="selectEmotion('حزين 😢')" class="emotion-btn p-4 border-2 rounded-xl text-center hover:border-indigo-500 transition flex flex-col items-center gap-2">
                                <span class="text-3xl">😢</span>
                                <span class="font-semibold text-sm">حزين</span>
                            </button>
                            <button type="button" onclick="selectEmotion('غاضب 😡')" class="emotion-btn p-4 border-2 rounded-xl text-center hover:border-indigo-500 transition flex flex-col items-center gap-2">
                                <span class="text-3xl">😡</span>
                                <span class="font-semibold text-sm">غاضب</span>
                            </button>
                        </div>
                    </div>

                    <!-- Notes -->
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-slate-700">هل تحب إضافة أي تفاصيل للمرشد؟</label>
                        <textarea id="student-note" rows="3" placeholder="اكتب ما يدور في ذهنك هنا..." class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none"></textarea>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> إرسال للمرشد
                    </button>
                </form>
                
                <div id="success-alert" class="hidden mt-4 p-4 bg-emerald-100 text-emerald-800 rounded-xl text-center font-semibold">
                    ✅ تم إرسال ردك بنجاح إلى المرشد الطلابي!
                </div>
            </div>
        </section>

        <!-- ================= COUNSELOR VIEW ================= -->
        <section id="counselor-view" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">لوحة متابعة المرشد 📋</h2>
                    <p class="text-slate-500 text-sm">تصلك هنا استجابات الطلاب ومشاعرهم بشكل لحظي.</p>
                </div>
                <div class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-xl font-bold text-sm">
                    إجمالي الردود: <span id="total-count">0</span>
                </div>
            </div>

            <!-- Responses List -->
            <div id="responses-list" class="space-y-4">
                <div class="text-center py-12 text-slate-400">
                    <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
                    <p>جاري تحميل الاستجابات...</p>
                </div>
            </div>
        </section>

    </main>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration (تكوين مجاني تجريبي جاهز)
        const firebaseConfig = {
            apiKey: "AIzaSyDemoKeyForTa3meenehPlatform",
            authDomain: "tamaneena-demo.firebaseapp.com",
            projectId: "tamaneena-demo",
            storageBucket: "tamaneena-demo.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:demo"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const responsesCol = collection(db, "responses");

        let selectedEmotion = "";

        // Selection Handler
        window.selectEmotion = (emotion) => {
            selectedEmotion = emotion;
            document.querySelectorAll('.emotion-btn').forEach(btn => {
                btn.classList.remove('border-indigo-600', 'bg-indigo-50');
            });
            event.currentTarget.classList.add('border-indigo-600', 'bg-indigo-50');
        };

        // Submit Student Response
        window.submitResponse = async (e) => {
            e.preventDefault();
            if (!selectedEmotion) {
                alert("يرجى اختيار شعورك أولاً!");
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "جاري الإرسال...";

            try {
                await addDoc(responsesCol, {
                    name: document.getElementById('student-name').value || "طالب مجهول",
                    grade: document.getElementById('student-grade').value,
                    emotion: selectedEmotion,
                    note: document.getElementById('student-note').value,
                    createdAt: serverTimestamp()
                });

                // Show success
                document.getElementById('success-alert').classList.remove('hidden');
                document.getElementById('feeling-form').reset();
                selectedEmotion = "";
                document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('border-indigo-600', 'bg-indigo-50'));

                setTimeout(() => {
                    document.getElementById('success-alert').classList.add('hidden');
                }, 3000);
            } catch (err) {
                console.error("Error adding document: ", err);
                alert("حدث خطأ أثناء الإرسال. تأكد من الاتصال بالإنترنت.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> إرسال للمرشد`;
            }
        };

        // Real-time Listener for Counselor View
        const q = query(responsesCol, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const listContainer = document.getElementById('responses-list');
            document.getElementById('total-count').innerText = snapshot.docs.length;

            if (snapshot.empty) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300 text-slate-400">
                        <i class="fa-regular fa-folder-open text-4xl mb-2"></i>
                        <p>لا توجد استجابات مرسلة حتى الآن.</p>
                    </div>`;
                return;
            }

            listContainer.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const time = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleTimeString('ar-JO', {hour: '2-digit', minute:'2-digit'}) : 'الآن';

                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition hover:shadow-md";
                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-800">${data.name}</span>
                            <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md">${data.grade}</span>
                            <span class="text-xs text-slate-400">${time}</span>
                        </div>
                        <p class="text-slate-600 text-sm">${data.note ? `"${data.note}"` : '<span class="text-slate-300 italic">بدون ملاحظات إضافية</span>'}</p>
                    </div>
                    <div class="bg-indigo-50 border border-indigo-100 text-indigo-800 font-bold px-4 py-2 rounded-xl text-lg flex items-center gap-2 self-end md:self-auto">
                        ${data.emotion}
                    </div>
                `;
                listContainer.appendChild(card);
            });
        });

        // Tab Switching Logic
        window.switchView = (view) => {
            const studentSec = document.getElementById('student-view');
            const counselorSec = document.getElementById('counselor-view');
            const btnStudent = document.getElementById('btn-student-view');
            const btnCounselor = document.getElementById('btn-counselor-view');

            if (view === 'student') {
                studentSec.classList.remove('hidden');
                counselorSec.classList.add('hidden');
                btnStudent.className = "px-4 py-1.5 rounded-md bg-white text-indigo-700 shadow transition";
                btnCounselor.className = "px-4 py-1.5 rounded-md text-indigo-100 hover:text-white transition";
            } else {
                studentSec.classList.add('hidden');
                counselorSec.classList.remove('hidden');
                btnCounselor.className = "px-4 py-1.5 rounded-md bg-white text-indigo-700 shadow transition";
                btnStudent.className = "px-4 py-1.5 rounded-md text-indigo-100 hover:text-white transition";
            }
        };
    </script>
</body>
</html>
